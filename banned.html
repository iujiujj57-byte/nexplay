<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b"><title>Access restricted — NexPlay</title><link rel="stylesheet" href="style.css"><style>body{display:grid;place-items:center;padding:20px}.ban-card{max-width:520px;width:100%;padding:34px;border:1px solid #383e48;border-radius:22px;background:#101217;text-align:center}.ban-card h1{font:700 36px 'Space Grotesk',sans-serif}.ban-card p{color:#aeb4bd;line-height:1.6}.ban-card button{margin-top:14px}</style></head><body><main class="ban-card"><span class="eyebrow">NEXPLAY ACCESS CONTROL</span><h1>Access restricted.</h1><p id="reason">This visitor profile has been restricted by the administrator.</p><p>If you think this is a mistake, contact the site administrator.</p><button id="checkAgain" class="primary-button">Check access again</button><p id="status" role="status"></p></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";import{getAuth,onAuthStateChanged,signInAnonymously}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCz7gweuP0E9-jXUjbyXMOlWeIHT4Bn8",authDomain:"nexplay-1029b.firebaseapp.com",projectId:"nexplay-1029b",storageBucket:"nexplay-1029b.firebasestorage.app",messagingSenderId:"288990411835",appId:"1:288990411835:web:f1a0697b6c4042fd3eb01e",measurementId:"G-7DKFNYY8L9"});const auth=getAuth(app),db=getFirestore(app);let ready=false;onAuthStateChanged(auth,async user=>{if(!user){try{await signInAnonymously(auth)}catch(e){document.querySelector('#status').textContent='Could not verify access.'}return}try{const b=await getDoc(doc(db,'bannedUsers',user.uid));if(b.exists()){const reason=b.data().reason;if(reason)document.querySelector('#reason').textContent=reason;ready=true}else location.replace('index.html')}catch(e){document.querySelector('#status').textContent='Could not check access. Please try again.'}});document.querySelector('#checkAgain').addEventListener('click',async()=>{document.querySelector('#status').textContent='Checking…';try{const u=auth.currentUser;if(!u)return;const b=await getDoc(doc(db,'bannedUsers',u.uid));if(b.exists())document.querySelector('#status').textContent='Access is still restricted.';else location.replace('index.html')}catch(e){document.querySelector('#status').textContent='Could not check access.'}});
</script></body></html>
